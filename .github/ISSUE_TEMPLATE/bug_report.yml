name: Bug report
description: Something renders wrong, crashes, or produces invalid PDF
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest script that shows the problem.
      render: php
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0, or a commit SHA"
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.3.x"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >-
        `qpdf --check` output, the offending PDF, the viewer you opened it in,
        relevant extensions (gd, iconv).
